# NewProxy 测试配置
# 用于 docker-compose 本地测试环境

[MySQL_Proxy_Layer]
port=4051
mng_port=9111
max_threads=4
log_dir=logs
log_level=debug
client_timeout=28800
server_timeout=28800
conn_pool_socket_max_serve_client_times=10000
max_sql_size=16777216
max_query_size=16777216
default_charset=33
stream_transport_enable=0

[Cluster_0]
name=test_cluster

[CTablet_0_t0]
name=t0

[Master_Host_g0]
host=127.0.0.1
port=3306
max_conn_pool_size=16
max_connections=256
connect_timeout=5
weight=1
cluster_tablet_name=t0

[DB_User_dbu]
db_username=root
db_password=test_password
default_db=test
cluster_name=test_cluster

[Product_User_pu]
username=root
password=test_password
db_username=root
max_connections=128
cluster_name=test_cluster
