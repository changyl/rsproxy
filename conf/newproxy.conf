# NewProxy newproxy 配置文件(最小示例)
# 格式:GKeyFile INI — [section] key=value, # 注释
# 对齐 C 版 conf/newproxy.conf

[MySQL_Proxy_Layer]
port=4051
# 管理 HTTP 面板/API/Prometheus 指标端口(http://<host>:9111/)
mng_port=9111
# 面板 Basic Auth(生产环境务必修改默认口令)
mng_user=admin
mng_password=admin
max_threads=8
log_dir=logs
log_level=info
client_timeout=28800
server_timeout=28800
conn_pool_socket_max_serve_client_times=10000
max_sql_size=16777216
max_query_size=16777216
default_charset = utf8
stream_transport_enable=0

slow_query_ms=200
[Cluster_0]
name=test_cluster

[CTablet_0_t0]
name=t0

[Master_Host_g0]
host=10.0.0.10
port=4859
max_conn_pool_size=16
max_connections=256
connect_timeout=5
weight=1
cluster_tablet_name=t0

[Slave_Host_g0]
host=10.0.0.10
port=4859
max_conn_pool_size=16
max_connections=256
connect_timeout=5
weight=1
cluster_tablet_name=t0

[DB_User_dbu]
db_username=newproxy_user
db_password=secret
default_db=test
cluster_name=test_cluster

[Product_User_pu]
username=app_user
password=app_pass
db_username=newproxy_user
max_connections=128
cluster_name=test_cluster

[Auth_IP_0]
ip=10.0.0.0
mask=8
users=app_user

# ── 配置中心(拓扑热更新,可选)────────────────────────────────
# 主从切换/加节点等拓扑变更通过配置中心按分片下发,代理毫秒级生效,无需重启。
# type: none(默认,仅文件配置) | etcd | zookeeper
# 数据布局: {root}/clusters/{cluster_id}/tablets/{tablet_id}
#   值为 JSON: {"cluster_id":"0","tablet_id":"t0","master":{"host":"10.0.0.1","port":3306},"slaves":[]}
# 示例(取消注释启用):
# [ConfigCenter]
# type=etcd
# endpoints=http://127.0.0.1:2379
# root=/newproxy

# ── Xenon raft 高可用(可选;按分片启用)───────────────────────
# 启用后代理内建探测 mysql.xenon_raft_status(需该分片 db_user 有 SELECT 权限),
# 自动发现 raft leader 并跟随;一致性档位:
#   strong(默认,全走 leader)| causal(GTID 高水位屏障读,跨客户端因果)|
#   session(读己之写/会话单调读)| eventual(免屏障分流,业务自担)
# 档位选择优先级:产品用户 > 库 > 分片默认 > strong(内置)。
# 注意:leader 列是 xenon raft 端点(host:8801 类);members 用 MySQL 端口。
# 示例(取消注释启用,表名/列随实际部署核对):
# [XenonRaft_0_t0]
# members=xenon1:3306,xenon2:3306,xenon3:3306
# raft_endpoints=xenon1:8801,xenon2:8801,xenon3:8801
# probe_interval=1000
# probe_timeout_ms=500
# leader_stale_ms=3000
# read_consistency=strong
# read_consistency_db=report=causal,user_list=session
# read_consistency_user=finance=strong,report_api=eventual
# barrier_wait_ms=200
# gtid_sample_cache_ms=30