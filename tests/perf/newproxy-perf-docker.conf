# NewProxy 性能测试配置 — Docker 环境（后端地址使用容器服务名）
# 与 newproxy-perf.conf 的区别：Master_Host_g0 host=mysql（Docker 服务名）
# 配置加载器支持主机名解析，运行时由 tokio DNS 解析为容器 IP。

[MySQL_Proxy_Layer]
port=4051
mng_port=9111
# 管理面板 Basic Auth(测试容器默认启用,与生产行为一致;可自行修改)
mng_user=admin
mng_password=admin
max_threads=8
log_dir=logs
log_level=warn
client_timeout=28800
server_timeout=28800
conn_pool_socket_max_serve_client_times=100000
max_sql_size=16777216
max_query_size=16777216
default_charset=33
stream_transport_enable=0

slow_query_ms=100
[Cluster_0]
name=test_cluster

[CTablet_0_t0]
name=t0

[Master_Host_g0]
host=mysql
port=3306
max_conn_pool_size=32
max_connections=512
connect_timeout=5
weight=1
cluster_tablet_name=t0

[DB_User_dbu]
db_username=root
db_password=test_password
default_db=sbtest
cluster_name=test_cluster

[Product_User_pu]
username=root
password=test_password
db_username=root
max_connections=512
cluster_name=test_cluster