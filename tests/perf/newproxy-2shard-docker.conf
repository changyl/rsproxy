# NewProxy 2 分片测试配置 — Docker 环境
# 与 newproxy-perf-docker.conf 的区别:
#   - 2 个分片(CTablet_0_t0 / CTablet_0_t1),各配独立后端
#     Master_Host_g0 → mysql-shard0(分片 0),Master_Host_g1 → mysql-shard1(分片 1)
#   - 按表尾号路由:表名 `table_x` 的尾号 % 分片数 决定目标分片
#     (sbtest_0 → 分片0, sbtest_1 → 分片1);无尾号表默认第一个分片
#   - 容器内端口 4051/9111,宿主机映射 4052/9112(见 docker-compose-2shard.yml)

[MySQL_Proxy_Layer]
port=4051
mng_port=9111
# 管理面板 Basic Auth(测试容器默认启用,与生产行为一致;可自行修改)
mng_user=admin
mng_password=admin
max_threads=8
log_dir=logs
log_level=warn
client_timeout=28800
server_timeout=28800
conn_pool_socket_max_serve_client_times=100000
max_sql_size=16777216
max_query_size=16777216
default_charset=33
stream_transport_enable=0

slow_query_ms=222
[Cluster_0]
name=test_cluster

# ─── 分片 0 ───
[CTablet_0_t0]
name=t0
rrule=sbtest1.id,hash_mod,0,1

# ─── 分片 1 ───
[CTablet_0_t1]
name=t1
rrule=sbtest1.id,hash_mod,0,1

# 分片 0 后端
[Master_Host_g0]
host=mysql-shard0
port=3306
max_conn_pool_size=32
max_connections=512
connect_timeout=5
weight=1
cluster_tablet_name=t0

# 分片 1 后端
[Master_Host_g1]
host=mysql-shard1
port=3306
max_conn_pool_size=32
max_connections=512
connect_timeout=5
weight=1
cluster_tablet_name=t1

[DB_User_dbu]
db_username=root
db_password=test_password
default_db=sbtest
cluster_name=test_cluster

[Product_User_pu]
username=root
password=test_password
db_username=root
max_connections=512
cluster_name=test_cluster